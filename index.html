<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ajedrez Aventura</title>
<meta name="description" content="Aprende ajedrez paso a paso con Robi: misiones, estrellas y partidas.">
<meta name="theme-color" content="#0f1f7a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ajedrez">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
/* VOICE: juguetón y claro, para un niño de 6 años que ya lee; frases cortas, mucho premio.
   IDEA: un mundo de bloques tipo videojuego, con misiones que se desbloquean una por una.
   PICTURE: el tablero de bloques gigante es el juego; Robi, un robot de bloques, guía al lado.
   COLOUR and TYPE: azul rey profundo, amarillo sol, verde lima, rosa como acento; Lilita One + Nunito.
   LAYOUT: mapa de misiones en cuadrícula; en juego, tablero grande y panel del entrenador al lado (apilado en móvil). */
:root{color-scheme:light dark;--bg:#1d3bd8;--deep:#0f1f7a;--sun:#ffd23f;--lime:#7ee03b;--pink:#ff4d8d;--cyan:#38d3ff;--ink:#fff;--card:#fff;--cink:#14204f;--l:#fde7b5;--d:#e98a3a}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:800 16px/1.5 Nunito,system-ui,sans-serif;overflow-x:clip;min-height:100vh;
background-image:linear-gradient(rgba(255,255,255,.05) 2px,transparent 2px),linear-gradient(90deg,rgba(255,255,255,.05) 2px,transparent 2px);background-size:48px 48px}
h1,h2,h3,.btn,.big{font-family:"Lilita One",Nunito,sans-serif;font-weight:400;letter-spacing:.3px}
.band{padding:clamp(16px,3vw,40px) max(4vw,14px)}
.wrap{max-width:1240px;margin:0 auto}
header.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px max(4vw,14px);background:var(--deep);border-bottom:6px solid #0a1557}
header.top h1{margin:0;font-size:clamp(24px,4vw,34px);line-height:1.05;color:var(--sun);text-shadow:0 3px 0 #0a1557}
.sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;background:#fff;color:var(--cink);border-radius:12px;padding:6px 12px;box-shadow:0 4px 0 #0a1557;white-space:nowrap}
.pill svg{width:20px;height:20px}
.tog{background:transparent;border:3px solid rgba(255,255,255,.35);color:#fff;border-radius:12px;padding:6px 10px;font:800 14px Nunito,system-ui,sans-serif;cursor:pointer;min-height:40px}
.tog[aria-pressed=true]{background:var(--lime);border-color:var(--lime);color:var(--cink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:8px 18px;border:0;border-radius:14px;background:var(--sun);color:var(--cink);font-size:19px;cursor:pointer;box-shadow:0 5px 0 #b38a00;transition:transform .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #b38a00}
.btn.g{background:var(--lime);box-shadow:0 5px 0 #4b9a17}.btn.p{background:var(--pink);color:#fff;box-shadow:0 5px 0 #b3245a}
.btn.w{background:#fff;box-shadow:0 5px 0 #a9b3e0}
button:focus-visible{outline:4px solid var(--cyan);outline-offset:3px}
/* mapa */
.hero{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center;margin-bottom:22px}
.robi{width:clamp(84px,14vw,130px);height:auto;filter:drop-shadow(0 6px 0 rgba(0,0,0,.25))}
.bub{position:relative;background:#fff;color:var(--cink);border-radius:18px;padding:14px 18px;font-size:clamp(16px,2.2vw,19px);box-shadow:0 6px 0 rgba(0,0,0,.2)}
.bub::before{content:"";position:absolute;left:-12px;top:26px;border:12px solid transparent;border-right-color:#fff;border-left:0}
.hero h2{margin:0 0 4px;font-size:clamp(28px,4.5vw,46px);line-height:1.05;color:var(--sun)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:18px}
.tile{position:relative;text-align:left;border:0;border-radius:18px;padding:16px;min-height:150px;cursor:pointer;color:var(--cink);display:flex;flex-direction:column;gap:4px;box-shadow:0 8px 0 rgba(0,0,0,.28);transition:transform .1s;font:800 15px Nunito,system-ui,sans-serif}
.tile:hover{transform:translateY(-3px)}
.tile .n{position:absolute;top:10px;right:12px;font:22px "Lilita One",system-ui,sans-serif;opacity:.45}
.tile .gl{font-size:44px;line-height:1;font-family:"Lilita One","Segoe UI Symbol","Noto Sans Symbols 2",sans-serif}
.tile h3{margin:4px 0 0;font-size:22px;line-height:1.1}
.tile .st{display:flex;gap:2px;margin-top:auto}.tile .st svg{width:22px;height:22px}
.tile.lock{background:#5a67a8!important;color:#c9d0f5;cursor:not-allowed}
.tile.next{outline:5px solid #fff;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px)}}
.foot{margin-top:28px;display:flex;gap:12px;flex-wrap:wrap;align-items:center;color:#c9d3ff;font-size:14px}
.link{background:none;border:0;color:#c9d3ff;text-decoration:underline;font:800 14px Nunito,system-ui,sans-serif;cursor:pointer;min-height:44px}
/* juego */
.pg{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:clamp(16px,3vw,36px);align-items:start;max-width:1140px;margin:0 auto}
.ph{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.ph h2{margin:0;font-size:clamp(24px,3.6vw,36px);line-height:1.05;color:var(--sun)}
.bf{display:grid;grid-template-columns:22px minmax(0,1fr);grid-template-rows:minmax(0,1fr) 24px;gap:4px;max-width:600px}
.rk,.fl{display:grid;font:20px "Lilita One",system-ui,sans-serif;color:#fff;text-align:center}
.rk{grid-template-rows:repeat(8,1fr);align-items:center}.fl{grid-template-columns:repeat(8,1fr);grid-column:2}
.bx{container-type:inline-size;border:8px solid var(--deep);border-radius:14px;box-shadow:0 10px 0 #0a1557;overflow:hidden;background:var(--deep)}
.board{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));grid-template-rows:repeat(8,minmax(0,1fr));aspect-ratio:1}
.sq{position:relative;overflow:hidden;min-height:0;border:0;padding:0;margin:0;display:grid;place-items:center;cursor:pointer;font-size:10.5cqw;line-height:1;box-shadow:inset 0 -.6cqw 0 rgba(0,0,0,.12),inset 0 .5cqw 0 rgba(255,255,255,.25)}
.sq.l{background:var(--l)}.sq.d{background:var(--d)}
.sq.last{background:#ffe066}.sq.d.last{background:#f5c13b}
.sq.sel{background:var(--lime)!important}
.sq.hint{background:var(--cyan)!important}
.sq.chk{background:radial-gradient(circle,#ff2d55 0 45%,#ff8fa3 75%)!important}
.sq.dot::after{content:"";position:absolute;width:30%;height:30%;border-radius:6px;background:rgba(15,31,122,.45)}
.sq.cap::after{content:"";position:absolute;inset:6%;border:1.1cqw solid rgba(255,45,85,.8);border-radius:10px}
.sq.ok{animation:ok .6s}.sq.bad{animation:bad .5s}
.sq.glow{background:var(--pink)!important;animation:pulse 1s infinite}
@keyframes ok{0%{background:var(--lime)}}@keyframes bad{0%,100%{transform:none}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@keyframes pulse{50%{filter:brightness(1.25)}}
.pc{font-family:"Segoe UI Symbol","Noto Sans Symbols 2","DejaVu Sans",sans-serif;position:relative;z-index:1;pointer-events:none}
.pc.w{color:#fff;-webkit-text-stroke:.5cqw #14204f;paint-order:stroke fill;text-shadow:0 .5cqw 0 rgba(0,0,0,.25)}
.pc.b{color:#1b1b2b;-webkit-text-stroke:.3cqw #fff;paint-order:stroke fill;text-shadow:0 .5cqw 0 rgba(0,0,0,.2)}
.star{position:absolute;width:70%;height:70%;animation:spin 3s linear infinite}
@keyframes spin{50%{transform:scale(.85) rotate(12deg)}}
.side{display:flex;flex-direction:column;gap:16px}
.coach{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start}
.coach .robi{width:clamp(70px,10vw,96px)}
.coach .bub{min-height:84px}
.info{background:var(--deep);border-radius:16px;padding:14px 16px;display:grid;gap:8px;box-shadow:0 6px 0 #0a1557}
.info .row{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.big{font-size:clamp(40px,7vw,64px);line-height:1;color:var(--sun);text-align:center}
.ctrls{display:flex;flex-wrap:wrap;gap:12px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:12px}
.opts .btn{font-size:22px}
.btn.right{background:var(--lime)}.btn.wrong{background:#c7cbe0;opacity:.6}
.qz{background:#fff;color:var(--cink);border-radius:20px;padding:clamp(18px,3vw,30px);box-shadow:0 10px 0 #0a1557;display:grid;gap:16px}
.qz h3{margin:0;font-size:clamp(22px,3.4vw,32px);line-height:1.15}
.qz .gls{font-size:clamp(46px,8vw,72px);line-height:1;font-family:"Segoe UI Symbol","Noto Sans Symbols 2",sans-serif;color:var(--bg)}
.qz .opts .btn{box-shadow:0 5px 0 #b38a00}
.lvl{display:flex;gap:8px;flex-wrap:wrap}.lvl .tog{color:#fff}
.mat{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;font-size:14px}
.bar{height:14px;border-radius:7px;background:#ff4d8d;overflow:hidden}.bar i{display:block;height:100%;background:var(--lime)}
/* modal */
.ov{position:fixed;inset:0;background:rgba(5,10,50,.7);display:grid;place-items:center;padding:16px;z-index:20}
.ov[hidden]{display:none}
.md{background:#fff;color:var(--cink);border-radius:24px;padding:26px;max-width:420px;width:100%;text-align:center;box-shadow:0 12px 0 #0a1557;display:grid;gap:12px;animation:pop .35s}
.md h2{margin:0;font-size:36px;line-height:1.05;color:var(--bg)}
.md .st{display:flex;justify-content:center;gap:6px}.md .st svg{width:54px;height:54px}
.md .bt{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
@keyframes pop{0%{transform:scale(.6);opacity:0}}
.cf{position:fixed;top:-20px;width:12px;height:12px;z-index:30;pointer-events:none;animation:fall 2.2s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@media(max-width:820px){.pg{grid-template-columns:minmax(0,1fr)}}
@media(max-width:600px){.hero{grid-template-columns:minmax(0,1fr)}.hero .robi{margin:0 auto}.bub::before{display:none}.bf{grid-template-columns:16px minmax(0,1fr)}.rk,.fl{font-size:15px}.tile{min-height:130px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <h1>Ajedrez Aventura</h1><span class="sp"></span>
  <span class="pill" title="Gemas"><svg viewBox="0 0 24 24"><path d="M6 3h12l4 6-10 12L2 9z" fill="#38d3ff" stroke="#0f1f7a" stroke-width="2"/><path d="M2 9h20M9 3l3 18 3-18" stroke="#0f1f7a" stroke-width="1.5" fill="none"/></svg><b id="gems">0</b></span>
  <span class="pill" id="rank">Peón novato</span>
  <button class="tog" id="tInst" hidden style="background:var(--sun);border-color:var(--sun);color:var(--cink)">Instalar</button>
  <button class="tog" id="tSnd" aria-pressed="true">Sonido</button>
  <button class="tog" id="tVoz" aria-pressed="false">Voz de Robi</button>
</header>

<main>
<section id="map" class="band"><div class="wrap">
  <div class="hero">
    <svg class="robi" viewBox="0 0 100 100" aria-hidden="true"><use href="#robi"/></svg>
    <div class="bub"><h2>¡Hola, Jacobo!</h2><span id="mapMsg">Soy Robi, tu entrenador de ajedrez. Completa las misiones en orden para ganar gemas y subir de rango.</span></div>
  </div>
  <div class="grid" id="tiles"></div>
  <div class="foot"><span>El progreso se guarda en este navegador.</span><button class="link" id="unlock">Desbloquear todas las misiones (para papá)</button><button class="link" id="reset">Borrar progreso</button></div>
</div></section>

<section id="play" class="band" hidden>
  <div class="pg">
    <div>
      <div class="ph"><button class="btn w" id="back">Mapa</button><h2 id="ptitle"></h2><span class="pill" id="pstep"></span></div>
      <div class="bf" id="bfr">
        <div class="rk" id="rk"></div>
        <div class="bx"><div class="board" id="board"></div></div>
        <div class="fl" id="fl"></div>
      </div>
      <div class="qz" id="quiz" hidden></div>
    </div>
    <aside class="side">
      <div class="coach"><svg class="robi" viewBox="0 0 100 100" aria-hidden="true"><use href="#robi"/></svg><p class="bub" id="bubble" aria-live="polite"></p></div>
      <div class="info" id="info"></div>
      <div class="ctrls" id="ctrls"></div>
    </aside>
  </div>
</section>
</main>

<div class="ov" id="ov" hidden><div class="md" id="md"></div></div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="robi" viewBox="0 0 100 100">
    <rect x="46" y="6" width="8" height="14" fill="#0f1f7a"/><rect x="40" y="0" width="20" height="11" rx="3" fill="#ff4d8d" stroke="#0f1f7a" stroke-width="3"/>
    <rect x="4" y="40" width="12" height="22" rx="3" fill="#7ee03b" stroke="#0f1f7a" stroke-width="4"/><rect x="84" y="40" width="12" height="22" rx="3" fill="#7ee03b" stroke="#0f1f7a" stroke-width="4"/>
    <rect x="14" y="18" width="72" height="66" rx="12" fill="#ffd23f" stroke="#0f1f7a" stroke-width="5"/>
    <rect x="14" y="66" width="72" height="18" rx="0" fill="#f2b900" opacity=".5"/>
    <rect x="25" y="34" width="18" height="18" rx="4" fill="#0f1f7a"/><rect x="57" y="34" width="18" height="18" rx="4" fill="#0f1f7a"/>
    <rect x="29" y="37" width="6" height="6" fill="#fff"/><rect x="61" y="37" width="6" height="6" fill="#fff"/>
    <path d="M33 60h34v5a8 8 0 0 1-8 8H41a8 8 0 0 1-8-8z" fill="#0f1f7a"/><rect x="40" y="60" width="20" height="5" fill="#fff"/>
  </symbol>
  <symbol id="st" viewBox="0 0 24 24"><path d="M12 1.8l3.1 6.6 7.1.8-5.3 4.9 1.5 7.1L12 17.6l-6.4 3.6 1.5-7.1-5.3-4.9 7.1-.8z" stroke="#0f1f7a" stroke-width="1.6" stroke-linejoin="round"/></symbol>
</svg>

<script>
{
const $=s=>document.querySelector(s);
// ENGINE-START
const FILES='abcdefgh';
const sq=n=>[8-(+n[1]),FILES.indexOf(n[0])];
const nm=(r,c)=>FILES[c]+(8-r);
const START='rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq -';
function parseFEN(f){const [p,t,cs,ep]=f.split(' ');const b=p.split('/').map(row=>{const a=[];for(const ch of row){if(/\d/.test(ch))for(let i=0;i<+ch;i++)a.push(null);else a.push(ch)}return a});
  return {b,turn:t||'w',cs:cs&&cs!=='-'?cs:'',ep:ep&&ep!=='-'?sq(ep):null}}
const isW=p=>!!p&&p===p.toUpperCase();
const col=p=>p?(isW(p)?'w':'b'):null;
const D={N:[[-2,-1],[-2,1],[-1,-2],[-1,2],[1,-2],[1,2],[2,-1],[2,1]],B:[[-1,-1],[-1,1],[1,-1],[1,1]],R:[[-1,0],[1,0],[0,-1],[0,1]]};
D.Q=D.B.concat(D.R);D.K=D.Q;
const inb=(r,c)=>r>=0&&r<8&&c>=0&&c<8;
function attacked(b,r,c,by){
  const pr=by==='w'?r+1:r-1,P=by==='w'?'P':'p';
  for(const dc of[-1,1]){if(inb(pr,c+dc)&&b[pr][c+dc]===P)return true}
  const N=by==='w'?'N':'n',K=by==='w'?'K':'k';
  for(const[dr,dc]of D.N){const y=r+dr,x=c+dc;if(inb(y,x)&&b[y][x]===N)return true}
  for(const[dr,dc]of D.K){const y=r+dr,x=c+dc;if(inb(y,x)&&b[y][x]===K)return true}
  const sl=(dirs,set)=>{for(const[dr,dc]of dirs){let y=r+dr,x=c+dc;while(inb(y,x)){const q=b[y][x];if(q){if(col(q)===by&&set.includes(q.toUpperCase()))return true;break}y+=dr;x+=dc}}return false};
  return sl(D.B,'BQ')||sl(D.R,'RQ');
}
function pseudo(s){const{b,turn}=s,ms=[],opp=turn==='w'?'b':'w';
  for(let r=0;r<8;r++)for(let c=0;c<8;c++){const p=b[r][c];if(!p||col(p)!==turn)continue;const t=p.toUpperCase();
    if(t==='P'){const d=turn==='w'?-1:1,st=turn==='w'?6:1,last=turn==='w'?0:7;
      const add=(tr,tc,x)=>ms.push(Object.assign({fr:r,fc:c,tr,tc},tr===last?{promo:turn==='w'?'Q':'q'}:{},x||{}));
      if(inb(r+d,c)&&!b[r+d][c]){add(r+d,c);if(r===st&&!b[r+2*d][c])add(r+2*d,c,{dbl:1})}
      for(const dc of[-1,1]){const tr=r+d,tc=c+dc;if(!inb(tr,tc))continue;const q=b[tr][tc];
        if(q&&col(q)!==turn)add(tr,tc,{cap:q});else if(!q&&s.ep&&s.ep[0]===tr&&s.ep[1]===tc)add(tr,tc,{epc:1,cap:turn==='w'?'p':'P'})}
    }else if(t==='N'||t==='K'){
      for(const[dr,dc]of D[t]){const tr=r+dr,tc=c+dc;if(!inb(tr,tc))continue;const q=b[tr][tc];if(!q||col(q)!==turn)ms.push({fr:r,fc:c,tr,tc,cap:q||undefined})}
      if(t==='K'&&s.cs){const row=turn==='w'?7:0,KS=turn==='w'?'K':'k',QS=turn==='w'?'Q':'q',R=turn==='w'?'R':'r';
        if(r===row&&c===4&&!attacked(b,row,4,opp)){
          if(s.cs.includes(KS)&&!b[row][5]&&!b[row][6]&&b[row][7]===R&&!attacked(b,row,5,opp)&&!attacked(b,row,6,opp))ms.push({fr:r,fc:c,tr:row,tc:6,castle:1});
          if(s.cs.includes(QS)&&!b[row][1]&&!b[row][2]&&!b[row][3]&&b[row][0]===R&&!attacked(b,row,3,opp)&&!attacked(b,row,2,opp))ms.push({fr:r,fc:c,tr:row,tc:2,castle:1});
        }}
    }else{
      for(const[dr,dc]of D[t]){let tr=r+dr,tc=c+dc;while(inb(tr,tc)){const q=b[tr][tc];if(q){if(col(q)!==turn)ms.push({fr:r,fc:c,tr,tc,cap:q});break}ms.push({fr:r,fc:c,tr,tc});tr+=dr;tc+=dc}}
    }}
  return ms}
function make(s,m){const b=s.b.map(r=>r.slice());const p=b[m.fr][m.fc];b[m.fr][m.fc]=null;
  if(m.epc)b[m.fr][m.tc]=null;
  b[m.tr][m.tc]=m.promo||p;
  if(m.castle){const r=m.tr;if(m.tc===6){b[r][5]=b[r][7];b[r][7]=null}else{b[r][3]=b[r][0];b[r][0]=null}}
  let cs=s.cs;if(p==='K')cs=cs.replace(/[KQ]/g,'');if(p==='k')cs=cs.replace(/[kq]/g,'');
  const tch=(r,c)=>{if(r===7&&c===7)cs=cs.replace('K','');if(r===7&&c===0)cs=cs.replace('Q','');if(r===0&&c===7)cs=cs.replace('k','');if(r===0&&c===0)cs=cs.replace('q','')};
  tch(m.fr,m.fc);tch(m.tr,m.tc);
  return{b,turn:s.turn==='w'?'b':'w',cs,ep:m.dbl?[(m.fr+m.tr)/2,m.fc]:null}}
function kingPos(b,c){const K=c==='w'?'K':'k';for(let r=0;r<8;r++)for(let x=0;x<8;x++)if(b[r][x]===K)return[r,x];return null}
function inCheck(s,c){const k=kingPos(s.b,c);return k?attacked(s.b,k[0],k[1],c==='w'?'b':'w'):false}
function legal(s){return pseudo(s).filter(m=>!inCheck(make(s,m),s.turn))}
const VAL={P:100,N:300,B:320,R:500,Q:900,K:0};
function evalB(b){let v=0;for(let r=0;r<8;r++)for(let c=0;c<8;c++){const p=b[r][c];if(!p)continue;const t=p.toUpperCase();
  let x=VAL[t];if(t!=='K'&&t!=='R')x+=(7-Math.abs(3.5-c)*2-Math.abs(3.5-r)*2)*3;if(t==='P')x+=(isW(p)?6-r:r-1)*6;v+=isW(p)?x:-x}return v}
const order=ms=>ms.sort((a,b)=>(b.cap?VAL[b.cap.toUpperCase()]:0)-(a.cap?VAL[a.cap.toUpperCase()]:0));

function loadPuz(){const m=MIS[G.mi];if(G.li===0)G.err=0;G.mode='puz';board(true);G.s=parseFEN(m.list[G.li]);G.sel=null;G.tg=[];G.last=null;G.hint=[];G.busy=false;G.stars=new Set;
  $('#pstep').textContent=`Reto ${G.li+1} de ${m.list.length}`;
  say(m.goal==='check'?(G.li===0?'Jaque es cuando atacas al rey. Juegas con las blancas: ¡haz jaque al rey negro!':'Busca la jugada que hace jaque.'):(G.li===0?'Jaque mate es cuando el rey está atacado y no tiene escape. ¡Ahí se gana! Busca el jaque mate en una jugada.':'¡Encuentra el jaque mate!'));
  setInfo(`<div class="row"><span>Juegas con</span><b>Blancas</b></div><div class="row"><span>Meta</span><b>${m.goal==='check'?'Hacer jaque':'Jaque mate en 1'}</b></div><div class="row"><span>Errores</span><b>${G.err}</b></div>`);
  ctrls([{t:'Pista',c:'w',fn:()=>{const mv=legal(G.s).find(x=>goalOk(make(G.s,x)));if(mv){G.hint=[[mv.fr,mv.fc]];say(`Pista: usa ${EL[G.s.b[mv.fr][mv.fc]]} ${NAME[G.s.b[mv.fr][mv.fc]].toLowerCase()} que está brillando.`);draw()}}}]);draw()}
function goalOk(ns){return MIS[G.mi].goal==='check'?inCheck(ns,'b'):inCheck(ns,'b')&&!legal(ns).length}
function mvPuz(m){const prev=G.s,ns=make(G.s,m);G.s=ns;G.sel=null;G.tg=[];G.last=[m.fr,m.fc,m.tr,m.tc];G.busy=true;draw();
  const mt=MIS[G.mi];
  if(goalOk(ns)){snd('win');say(mt.goal==='check'?'¡JAQUE! ¡Muy bien!':'¡JAQUE MATE! ¡El rey no puede escapar!');addGems(1);
    setTimeout(()=>{G.li++;if(G.li<mt.list.length)loadPuz();else{const s=G.err<=1?3:G.err<=3?2:1;modal(mt.goal==='check'?'¡Maestro del jaque!':'¡Maestro del mate!',s,`Tuviste ${G.err} error${G.err===1?'':'es'}.`,[{t:'Repetir',c:'w',fn:()=>{G.li=0;loadPuz()}},{t:'Volver al mapa',c:'g',fn:()=>finishMission(s)}])}},1500)}
  else{snd('bad');G.err++;say(mt.goal==='mate'&&inCheck(ns,'b')?'Es jaque, pero el rey puede escapar. Busca otra jugada.':'Esa jugada no ataca al rey. ¡Intenta otra vez!');
    setTimeout(()=>{G.s=prev;G.last=null;G.busy=false;draw()},1100)}}
/* ---------- partida ---------- */
const LV=[{n:'Fácil',d:1,z:220,gm:5,st:1},{n:'Medio',d:2,z:40,gm:10,st:2},{n:'Difícil',d:3,z:12,gm:20,st:3}];
G.lvl=0;
function startGame(){G.mode='game';board(true);G.s=parseFEN(START);G.hist=[];G.sel=null;G.tg=[];G.last=null;G.hint=[];G.busy=false;G.tips={};G.stars=new Set;G.over=false;
  $('#pstep').textContent=LV[G.lvl].n;say('¡A jugar! Tú juegas con las blancas y empiezas. Toca una pieza para ver a dónde puede ir.');gameUI();draw()}
function mat(b,w){return b.flat().filter(p=>p&&isW(p)===w).reduce((a,p)=>a+PTS[p.toUpperCase()],0)}
function gameUI(){const a=mat(G.s.b,true),r=mat(G.s.b,false);
  setInfo(`<div class="row"><span>Nivel de Robi</span><span class="lvl">${LV.map((l,i)=>`<button class="tog" data-l="${i}" aria-pressed="${i===G.lvl}">${l.n}</button>`).join('')}</span></div>
  <div class="mat"><b>Tú ${a}</b><div class="bar"><i style="width:${a+r?a/(a+r)*100:50}%"></i></div><b>${r} Robi</b></div>
  <div class="row"><span>${a>r?`¡Vas ganando por ${a-r}!`:a<r?`Robi va ganando por ${r-a}`:'Van empatados en puntos'}</span></div>`);
  $('#info').onclick=e=>{const b=e.target.closest('[data-l]');if(b){G.lvl=+b.dataset.l;startGame()}};
  ctrls([{t:'Pista',c:'w',fn:hintGame},{t:'Deshacer',c:'w',fn:undo},{t:'Nueva partida',c:'p',fn:startGame}])}
function hintGame(){if(G.busy||G.over)return;const m=best(G.s,2,0);if(!m)return;const t=G.s.b[m.fr][m.fc].toUpperCase();G.hint=[[m.fr,m.fc],[m.tr,m.tc]];G.sel=null;G.tg=[];
  say(`Pista: mueve ${EL[t]} ${NAME[t].toLowerCase()} de ${nm(m.fr,m.fc)} a ${nm(m.tr,m.tc)}.`);draw()}
function undo(){if(G.busy||!G.hist.length)return;G.s=G.hist.pop();G.over=false;G.last=null;G.sel=null;G.tg=[];G.hint=[];say('Listo, deshicimos la jugada. ¡Piensa con calma!');gameUI();draw()}
function mvGame(m){if(G.over)return;G.hist.push(G.s);const mover=G.s.b[m.fr][m.fc].toUpperCase();const ns=make(G.s,m);G.s=ns;G.last=[m.fr,m.fc,m.tr,m.tc];G.sel=null;G.tg=[];
  let msg='';
  if(m.cap){const t=m.cap.toUpperCase();msg=`¡Te comiste ${EL[t]} ${NAME[t].toLowerCase()} de Robi! +${PTS[t]} punto${PTS[t]>1?'s':''}.`;snd('cap')}else snd('move');
  if(m.castle)msg='¡Enroque! Tu rey quedó protegido.';
  if(m.promo)msg='¡Tu peón llegó al final y se convirtió en reina!';
  if(inCheck(ns,'b'))msg+=' ¡Jaque!';
  const pt=(m.promo||mover).toUpperCase();
  if(pt!=='K'&&attacked(ns.b,m.tr,m.tc,'b')&&!attacked(ns.b,m.tr,m.tc,'w'))msg+=` Ojo: tu ${NAME[pt].toLowerCase()} en ${nm(m.tr,m.tc)} se puede perder.`;
  if(msg)say(msg.trim());
  gameUI();draw();if(endCheck())return;
  G.busy=true;$('#pstep').textContent='Robi piensa…';
  setTimeout(robot,350)}
function robot(){const L=LV[G.lvl];const m=best(G.s,L.d,L.z);if(!m){G.busy=false;return}
  const ns=make(G.s,m);G.s=ns;G.last=[m.fr,m.fc,m.tr,m.tc];G.busy=false;$('#pstep').textContent=L.n;
  let msg='';
  if(m.cap){const t=m.cap.toUpperCase();msg=`Robi se comió tu ${NAME[t].toLowerCase()}.`;snd('cap')}else snd('move');
  if(inCheck(ns,'w'))msg+=' ¡Estás en jaque! Protege a tu rey: muévelo, tapa el ataque o come la pieza que ataca.';
  if(msg)say(msg.trim());
  gameUI();draw();endCheck()}
function endCheck(){const ms=legal(G.s);const only=G.s.b.flat().filter(Boolean).length===2;
  if(ms.length&&!only)return false;G.over=true;G.busy=false;
  const L=LV[G.lvl];
  if(!only&&inCheck(G.s,G.s.turn)){
    if(G.s.turn==='b'){snd('win');addGems(L.gm);P.done.duel=Math.max(P.done.duel||0,L.st);save();say('¡JAQUE MATE! ¡Le ganaste a Robi!');
      setTimeout(()=>modal('¡Le ganaste a Robi!',L.st,`Nivel ${L.n}. +${L.gm} gemas${G.lvl<2?'. ¿Probamos el siguiente nivel?':''}`,[{t:'Otra partida',c:'w',fn:startGame},G.lvl<2?{t:'Subir de nivel',c:'g',fn:()=>{G.lvl++;startGame()}}:{t:'Volver al mapa',c:'g',fn:showMap}]),900)}
    else{snd('bad');say('Jaque mate de Robi. ¡No pasa nada! Así se aprende.');setTimeout(()=>modal('Robi ganó esta vez',0,'Usa «Pista» cuando no sepas qué hacer y fíjate en los avisos de peligro.',[{t:'Deshacer',c:'w',fn:undo},{t:'Revancha',c:'g',fn:startGame}]),900)}}
  else{addGems(2);say('¡Tablas! Nadie gana. +2 gemas.');setTimeout(()=>modal('¡Tablas!',1,only?'Solo quedaron los dos reyes.':'El rey no tiene jugadas pero no está en jaque: eso es «ahogado». +2 gemas',[{t:'Otra partida',c:'g',fn:startGame}]),900)}
  return true}
/* ---------- modal ---------- */
function modal(t,s,txt,bt){$('#md').innerHTML=`<h2>${t}</h2>${s?`<div class="st">${[1,2,3].map(k=>STAR(k<=s?'#ffd23f':'#dfe3f5')).join('')}</div>`:''}<p>${txt}</p><div class="bt">${bt.map((b,i)=>`<button class="btn ${b.c}" data-b="${i}">${b.t}</button>`).join('')}</div>`;
  $('#ov').hidden=false;$('#md').onclick=e=>{const b=e.target.closest('[data-b]');if(b){$('#ov').hidden=true;bt[+b.dataset.b].fn()}};
  $('#md').querySelector('.btn:last-child').focus();
  if(s>=2&&!matchMedia('(prefers-reduced-motion:reduce)').matches)for(let i=0;i<40;i++){const d=document.createElement('div');d.className='cf';d.style.left=Math.random()*100+'vw';d.style.background=['#ffd23f','#7ee03b','#ff4d8d','#38d3ff'][i%4];d.style.animationDelay=Math.random()*.6+'s';document.body.appendChild(d);setTimeout(()=>d.remove(),3000)}}
/* ---------- eventos ---------- */
$('#tiles').addEventListener('click',e=>{const t=e.target.closest('.tile');if(!t)return;initAudio();const i=+t.dataset.i;if(!unlocked(i)){snd('bad');$('#mapMsg').textContent='Esa misión está cerrada. Termina la anterior para abrirla.';return}snd('tap');play(i)});
$('#back').onclick=()=>{try{speechSynthesis.cancel()}catch(e){}showMap()};
$('#tSnd').onclick=()=>{P.snd=!P.snd;save();hud();initAudio();snd('tap')};
$('#tVoz').onclick=()=>{P.voz=!P.voz;save();hud();if(P.voz)say($('#play').hidden?'¡Hola Jacobo! Ahora puedo hablar.':$('#bubble').textContent);else try{speechSynthesis.cancel()}catch(e){}};
$('#unlock').onclick=()=>{P.all=true;save();showMap()};
let rc=0;$('#reset').onclick=e=>{if(++rc<2){e.target.textContent='Toca otra vez para confirmar';return}P={gems:0,done:{},all:false,snd:P.snd,voz:P.voz};rc=0;e.target.textContent='Borrar progreso';save();showMap()};
showMap();
let dp=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e;$('#tInst').hidden=false});
$('#tInst').onclick=async()=>{if(!dp)return;dp.prompt();try{await dp.userChoice}catch(e){}dp=null;$('#tInst').hidden=true};
window.addEventListener('appinstalled',()=>{$('#tInst').hidden=true});
if('serviceWorker' in navigator&&location.protocol==='https:'){try{navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}}
}
}
</script>
</body>
